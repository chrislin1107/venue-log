<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>場館筆記</title>
<meta name="apple-mobile-web-app-title" content="場館筆記">
<meta name="application-name" content="場館筆記">
<style>
/* 固定黑色版（跟 AcoustiX logo 一致）；PDF 報表另外用白底 */
:root{
  color-scheme: dark;
  --bg:#0b0b0c; --card:#161618; --ink:#f2f2f2; --sub:#8e8e93; --line:#2a2a2d;
  --chip:#1f1f22; --on:#f2f2f2; --onink:#0b0b0c; --err:#ff6b5e; --ok:#5fc48a;
  --logo-dark:none; --logo-light:block;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand img{height:30px;width:auto}
.brand .l-dark{display:var(--logo-dark)} .brand .l-light{display:var(--logo-light)}
.brand span{font-size:13px;color:var(--sub);letter-spacing:.08em}
.tabs{display:flex;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px 0;font:inherit;font-weight:600;color:var(--sub);
  border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.steps{display:flex;gap:4px;margin:14px 0 6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line);cursor:pointer}
.steps i.done{background:var(--sub)} .steps i.on{background:var(--ink)}
.stepname{font-size:13px;color:var(--sub);margin-bottom:8px}
h2{font-size:22px;margin:4px 0 14px;letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.f{grid-column:span 2;min-width:0;position:relative} .f.half{grid-column:span 1}
.sugg-box{position:absolute;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:8;
  max-height:264px;overflow:auto;box-shadow:0 10px 28px rgba(0,0,0,.6)}
.sugg-box div{padding:11px 12px;cursor:pointer;border-bottom:1px solid var(--line)} .sugg-box div:last-child{border:0}
.sugg-box small{color:var(--sub);margin-left:8px;font-size:12px}
.vcount{margin-top:8px;font-size:13px;line-height:1.5;padding:9px 11px;border-radius:9px;background:var(--chip);border:1px solid var(--line)}
.filelist div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:14px;word-break:break-all}
.filelist small{color:var(--sub);margin-left:6px}
.filelist b{cursor:pointer;color:var(--sub);white-space:nowrap}
.tips{font-size:13px;color:var(--sub);margin:-2px 0 10px;line-height:2}
.tips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;margin:0 6px 0 0;color:var(--ink);line-height:26px}
.note{padding:10px 0;border-bottom:1px solid var(--line)} .note:last-child{border-bottom:0}
.note .m{font-size:12px;color:var(--sub);margin-bottom:2px}
.f.sub{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.1em;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.f.sub:first-child{border-top:0;padding-top:0;margin-top:0}
label.t{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
label.t em{color:var(--err);font-style:normal;margin-left:2px}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date],input[type=time]{min-height:46px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus{border-color:var(--ink)}
.f.bad input,.f.bad textarea,.f.bad .chips{outline:2px solid var(--err);outline-offset:2px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:15px;
  padding:8px 14px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--on);color:var(--onink);border-color:var(--on)}
.stars{display:flex;gap:6px}
.stars button{font-size:28px;line-height:1;background:none;border:0;color:var(--line);cursor:pointer;padding:2px}
.stars button.on{color:var(--ink)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photos div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--chip)}
.photos img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photos b{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.65);
  color:#fff;display:grid;place-items:center;font-size:15px;cursor:pointer}
.addphoto{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);
  border-radius:12px;padding:16px;color:var(--sub);cursor:pointer}
.addphoto input{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;font:inherit;font-weight:600;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--on);color:var(--onink);border-color:var(--on)}
.btn:disabled{opacity:.5}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0;display:flex;gap:10px;align-items:center;
  justify-content:space-between;background:var(--chip)}
.banner a{color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.msg{font-size:14px;margin-top:8px;color:var(--err)}
.center{text-align:center;padding:40px 8px}
.center .big{font-size:44px}
.search{display:flex;gap:8px;margin:14px 0 10px}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  margin-bottom:10px;cursor:pointer}
.item .v{font-weight:700;font-size:17px}
.item .m{font-size:13px;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-left:6px;
  color:var(--sub);vertical-align:2px;font-weight:500}
dl{margin:0} dt{font-size:12px;color:var(--sub);margin-top:10px} dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.sec h3{font-size:15px;margin:0 0 2px;letter-spacing:.04em}
.muted{color:var(--sub);font-size:14px}
.back{background:none;border:0;font:inherit;color:var(--sub);padding:12px 0 4px;cursor:pointer}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20}
.zoom img{max-width:100%;max-height:100%}
.hide{display:none!important}
</style>
</head>

    const city = k === '場館' ? cityEl().value.trim() : '';
    let m = candidates(k, other).filter(v => v.toLowerCase() !== q && v.toLowerCase().includes(q));
    if (!q && city) m = m.filter(v => cityOf(v) === city);          // 先填城市：只列該城市的場館
    const rank = v => (q && v.toLowerCase().startsWith(q) ? 0 : 1) + (city && cityOf(v) !== city ? 2 : 0);
    m = m.map((v, i) => [v, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]).slice(0, 8);
    if (!m.length || (!q && !city && k === '場館' && !hist()[k])) return box.classList.add('hide');
    box.style.top = (input.offsetTop + input.offsetHeight + 4) + 'px';
    box.innerHTML = m.map(v => `<div data-v="${esc(v)}">${esc(v)}${k === '場館' && cityOf(v) ? `<small>${esc(cityOf(v))}</small>` : ''}</div>`).join('');
    box.classList.remove('hide');
  };
  input.setAttribute('autocomplete', 'off');
  input.addEventListener('input', show); input.addEventListener('focus', show);
  input.addEventListener('blur', () => setTimeout(() => box.classList.add('hide'), 200));
  box.addEventListener('mousedown', e => e.preventDefault());
  box.addEventListener('click', e => {
    const d = e.target.closest('[data-v]'); if (!d) return;
    input.value = d.dataset.v; box.classList.add('hide');
    if (k === '場館' && !cityEl().value && cityOf(d.dataset.v)) cityEl().value = cityOf(d.dataset.v);
    input.closest('.f').classList.remove('bad');
    updateVenueCount();
    saveDraft();
  });
}

async function go(dir){

async function submit(){

/* 照片：在手機上先縮到長邊 1600、JPEG，上傳才快 */
async function addPhotos(input, pi){
  const list = photoSets[pi] = photoSets[pi] || [], max = PHOTO_FIELDS[pi].max || 20;
  if (max === 1 && input.files.length) list.length = 0;   // 只能一張：新的換掉舊的
  for (const file of input.files) {
    if (list.length >= max) { toast(`最多 ${max} 張，多的沒有加進來`); break; }
    try {
      const url = await shrink(file);
      list.push({url, b64: url.split(',')[1]});
    } catch (e) { toast('有一張照片讀不了'); }
  }
  input.value = ''; renderPhotos(pi);
}
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej; img.src = u;
  });
}
function renderPhotos(pi){
  if (pi == null) return PHOTO_FIELDS.forEach((_, i) => renderPhotos(i));
  $('ph_' + pi).innerHTML = (photoSets[pi] || []).map((p, i) => `<div>${p.url ? `<img src="${p.url}" onclick="zoom(this.src)" alt="">` : ''}<b onclick="photoSets[${pi}].splice(${i},1);renderPhotos(${pi})">×</b></div>`).join('');
}

/* 附加檔案：直接上傳（每個 30 MB 內），太大的請貼連結 */
const BLOCKED = /\.(exe|msi|bat|cmd|com|scr|ps1|sh|app|dmg|pkg|apk|js|vbs|jar|html?|svg)$/i;
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
function parseFiles(v){ try { const a = JSON.parse(v || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
async function addFiles(input, fi){
  const f = FILE_FIELDS[fi], list = fileSets[fi] = fileSets[fi] || [];
  for (const file of input.files) {
    if (list.length >= f.max) { toast(`最多 ${f.max} 個檔案`); break; }
    if (BLOCKED.test(file.name)) { toast('這種檔案類型不能上傳：' + file.name); continue; }
    if (file.size > f.maxMB * 1048576) { toast(`${file.name} 超過 ${f.maxMB} MB，請改貼雲端連結`); continue; }
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(file); });
      list.push({n: file.name, size: file.size, b64});
    } catch (e) { toast('讀不了這個檔案：' + file.name); }
  }
  input.value = ''; renderFiles(fi);
}
function renderFiles(fi){
  if (fi == null) return FILE_FIELDS.forEach((_, i) => renderFiles(i));
  $('fl_' + fi).innerHTML = (fileSets[fi] || []).map((x, i) => `<div><span>${esc(x.n)}${x.size ? `<small>${fmtSize(x.size)}</small>` : ''}</span><b onclick="fileSets[${fi}].splice(${i},1);renderFiles(${fi})">×</b></div>`).join('');
}
async function downloadFile(id){
  showSheet('<p class="muted">正在取得檔案…</p>');
  try {
    const f = await call('getFile', code(), id);
    const bytes = Uint8Array.from(atob(f.b64), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes]));
    showSheet(`<h2 style="margin-top:0">檔案準備好了</h2><p class="muted">${esc(f.name)}</p>
      <a class="btn pri" style="display:block;text-align:center;text-decoration:none" href="${url}" download="${esc(f.name)}">下載</a>`);
  } catch (e) { showSheet(`<p class="msg">${esc(e.message)}</p>`); }
}

async function exportPdf(r){

    const groups = [];
    for (const f of PHOTO_FIELDS) {

function logout(){
  store.set('code', null, true); store.set('name', null, true); records = null;
  $('detailView').classList.add('hide'); openSearch();
}
function renderList(){
  $('modeSwitch').innerHTML = [['rec', '依紀錄'], ['venue', '依場館']].map(([m, t]) =>
    `<button type="button" class="${m === mode ? 'on' : ''}" onclick="mode='${m}';renderList()">${t}</button>`).join('');
  const brands = ['全部', 'L-Acoustics', 'd&b', 'Meyer Sound', '其他'];
  $('brandFilter').innerHTML = brands.map(b => `<button type="button" class="${b === brand ? 'on' : ''}" onclick="brand='${b}';renderList()">${esc(b)}</button>`).join('');
  const q = $('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows = (records || []).filter(r => (brand === '全部' || (brand === '其他' ? String(r['系統品牌']).startsWith('其他') : r['系統品牌'] === brand)) && q.every(w => r.text.toLowerCase().includes(w)))
    .sort((a, b) => String(b['演出日期']).localeCompare(String(a['演出日期'])));
  if (mode === 'venue') {
    const g = {};
    rows.forEach(r => (g[r['場館']] = g[r['場館']] || []).push(r));
    const vs = Object.entries(g).sort((a, b) => b[1].length - a[1].length || String(b[1][0]['演出日期']).localeCompare(String(a[1][0]['演出日期'])));
    $('count').textContent = `共 ${vs.length} 個場館`;
    $('list').innerHTML = vs.map(([v, rs]) => `<a class="item" data-venue="${esc(v)}">
      <div class="v">${esc(v)}<span class="tag">${rs.length} 次</span></div>
      <div class="m">${esc(rs[0]['城市'])} · 最近一次 ${esc(rs[0]['演出日期'])}</div></a>`).join('') || '<p class="muted">沒有符合的場館</p>';
    $('list').onclick = e => { const a = e.target.closest('[data-venue]'); if (a) openVenue(a.dataset.venue); };
    return;
  }
  $('list').onclick = null;
  $('count').textContent = `共 ${rows.length} 筆`;
  $('list').innerHTML = rows.map(r => `<a class="item" onclick="openRecord('${esc(r.ID)}')">
    <div class="v">${esc(r['場館'])}<span class="tag">${esc(r['系統品牌'])}</span></div>
    <div class="m">${esc(r['城市'])} · ${esc(r['演出日期'])} · ${esc(r['藝人／專案'])}</div>
    <div class="m">${esc(r['填寫人'])} 填寫</div></a>`).join('') || '<p class="muted">沒有符合的紀錄</p>';
}
let current = null;
async function openRecord(id){
  $('listView').classList.add('hide');
  const dv = $('detailView'); dv.classList.remove('hide'); dv.innerHTML = '<p class="muted">載入中…</p>';
  window.scrollTo(0, 0);
  try { current = await call('getRecord', code(), id); } catch (e) { return kick(e.message); }
  const r = current;
  const secs = SECTIONS.map(s => {
    const rows = s.fields.filter(f => f.t !== 'photos' && f.t !== 'files' && f.t !== 'head' && r[f.k]).map(f =>
      `<dt>${esc(f.k)}</dt><dd>${f.t === 'stars' ? '★'.repeat(+r[f.k]) + '☆'.repeat(5 - r[f.k]) : esc(r[f.k])}</dd>`).join('');
    return rows ? `<div class="card sec"><h3>${esc(s.title)}</h3><dl>${rows}</dl></div>` : '';
  }).join('');
  dv.innerHTML = `<button class="back" onclick="backFromRecord()">‹ ${venueOpen ? '回場館' : '回列表'}</button>
    <h2 style="margin-bottom:2px">${esc(r['場館'])}</h2>
    <p class="muted" style="margin:0 0 14px">${esc(r['城市'])} · ${esc(r['演出日期'])} · ${esc(r['藝人／專案'])}</p>
    ${secs}
    ${PHOTO_FIELDS.map(f => { const ids = splitIds(r[f.k]); return ids.length ? `<div class="card sec"><h3>${esc(f.label || f.k)}</h3><div class="photos">${ids.map(p => `<div data-p="${esc(p)}"></div>`).join('')}</div></div>` : ''; }).join('')}
    ${FILE_FIELDS.map(f => { const fs = parseFiles(r[f.k]); return fs.length ? `<div class="card sec"><h3>${esc(f.k)}</h3><div class="filelist">${fs.map(x => `<div><span>${esc(x.n)}</span><b onclick="downloadFile('${esc(x.id)}')">下載</b></div>`).join('')}</div></div>` : ''; }).join('')}
    <p class="muted" style="font-size:12px">編號 ${esc(r.ID)} · 建立 ${esc(r['建立時間'])} · 最後修改 ${esc(r['最後修改時間'])}（${esc(r['最後修改人'])}）</p>
    <div style="display:flex;gap:10px">
      <button class="btn" onclick="exportPdf(current)">輸出 PDF</button>
      <button class="btn pri" onclick="startEdit()">修改這筆紀錄</button>
    </div>`;
  dv.querySelectorAll('[data-p]').forEach(async el => {
    try { const url = photoCache[el.dataset.p] || await call('getPhoto', code(), el.dataset.p); if (url) photoCache[el.dataset.p] = url; if (url) el.innerHTML = `<img src="${url}" onclick="zoom(this.src)" alt="">`; } catch (e) {}
  });
}
function backToList(){ $('detailView').classList.add('hide'); openSearch(); }
function backFromRecord(){ venueOpen ? openVenue(venueOpen) : backToList(); }
function openVenue(v){
  venueOpen = v;
  const rs = (records || []).filter(r => r['場館'] === v).sort((a, b) => String(b['演出日期']).localeCompare(String(a['演出日期'])));
  const notes = rs.filter(r => r['下次要注意']);
  const st = rs.map(r => +r['場地好做程度']).filter(Boolean);
  const avg = st.length ? (st.reduce((a, b) => a + b, 0) / st.length).toFixed(1) : '';
  $('listView').classList.add('hide');
  const dv = $('detailView'); dv.classList.remove('hide'); window.scrollTo(0, 0);
  dv.innerHTML = `<button class="back" onclick="venueOpen=null;backToList()">‹ 回場館列表</button>
    <h2 style="margin-bottom:2px">${esc(v)}</h2>
    <p class="muted" style="margin:0 0 14px">${esc(rs[0] ? rs[0]['城市'] : '')} · 共 ${rs.length} 次紀錄${avg ? ` · 平均好做程度 ${avg} ★` : ''}</p>
    ${notes.length ? `<div class="card sec"><h3>歷次「下次要注意」</h3>${notes.map(r => `<div class="note">
      <div class="m">${esc(r['演出日期'])} · ${esc(r['藝人／專案'])} · ${esc(r['填寫人'])}</div><div>${esc(r['下次要注意'])}</div></div>`).join('')}</div>` : ''}
    <h3 style="font-size:15px;margin:18px 0 8px">每次紀錄</h3>
    ${rs.map(r => `<a class="item" onclick="openRecord('${esc(r.ID)}')">
      <div class="v" style="font-size:16px">${esc(r['演出日期'])}<span class="tag">${esc(r['系統品牌'])}</span></div>
      <div class="m">${esc(r['藝人／專案'])} · ${esc(r['填寫人'])} 填寫</div></a>`).join('')}`;
}
function startEdit(){
  const r = current; editId = r.ID;
  setData(r);
  photoSets = {};
  PHOTO_FIELDS.forEach((f, pi) => photoSets[pi] = splitIds(r[f.k]).map(id => ({id, url: photoCache[id] || ''})));
  renderPhotos();
  fileSets = {}; FILE_FIELDS.forEach((f, fi) => fileSets[fi] = parseFiles(r[f.k]));
  renderFiles();
  $('editId').textContent = r['場館'] + '（' + r.ID + '）';
  $('editBanner').classList.remove('hide'); $('draftBanner').classList.add('hide'); $('done').classList.add('hide');
  step = 0; showTab('form');
}
function cancelEdit(){ $('editBanner').classList.add('hide'); clearForm(); showTab('search'); }
function zoom(src){ $('zoomImg').src = src; $('zoom').style.display = 'flex'; }

let toastT;
function toast(m){
  let t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--on);color:var(--onink);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%;text-align:center';
    document.body.appendChild(t); }
  t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 3000);
}

/* ============ 啟動 ============ */
buildForm();
call('getSuggestions').then(x => { if (x) pubSugg = x; updateVenueCount(); }).catch(() => {});
const draft = store.get('draft');
if (draft) { try { setData(JSON.parse(draft)); $('draftBanner').classList.remove('hide'); } catch (e) {} }
else setData({'填寫人': store.get('who') || ''});
showStep();
</script>
</body>
</html>
